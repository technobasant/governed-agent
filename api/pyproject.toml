[project]
name = "ga-api"
version = "0.1.0"
description = "FastAPI service: runs, review queue, append-only audit log and an action outbox."
license = { text = "Apache-2.0" }
authors = [{ name = "Basant Bhattarai" }]
requires-python = ">=3.12"
dependencies = [
    "ga-core",
    "ga-agent",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ga_api"]

[tool.uv.sources]
ga-core = { workspace = true }
ga-agent = { workspace = true }
