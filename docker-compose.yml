# PostgreSQL, the MCP server, the API, the review UI and Jaeger. The model runs on the
# host under Ollama (`ollama pull qwen3:8b`); set GA_MODEL=demo to run without one.
name: governed-agent

x-python: &python
  build:
    context: .
    dockerfile: docker/python.Dockerfile
  image: governed-agent-python:0.1.0
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports: ["127.0.0.1:${PG_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 2s
      timeout: 3s
      retries: 30

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:${JAEGER_PORT:-16686}:16686"   # UI
      - "127.0.0.1:4318:4318"     # OTLP over HTTP

  mcp:
    <<: *python
    command: >
      python -m ga_mcp.server --host 0.0.0.0 --port 8001
      --allowed-hosts mcp:*,localhost:*,127.0.0.1:*
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      LOG_LEVEL: INFO
    ports: ["127.0.0.1:${MCP_PORT:-8001}:8001"]

  api:
    <<: *python
    command: python -m ga_api.app
    environment:
      DATABASE_URL: postgresql+asyncpg://agent:agent@postgres:5432/agent
      GA_MCP_URL: http://mcp:8001/mcp
      GA_MODEL: ${GA_MODEL:-ollama:qwen3:8b}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GA_API_HOST: 0.0.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      LOG_LEVEL: INFO
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      mcp: {condition: service_started}

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: governed-agent-web:0.1.0
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on: [api]

volumes:
  pgdata:
